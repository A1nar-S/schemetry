# cargo-audit configuration (the CI "cargo audit" job runs from the repo root).
#
# The advisories below affect crates that only appear in Cargo.lock because polars
# declares them as *optional* dependencies (zstd via polars-arrow compression, quick-xml
# via object_store cloud storage). Schemetry builds polars with
# `default-features = false, features = ["csv"]`, so none of them is compiled or linked:
#   cargo tree -i zstd --workspace --target all             -> "nothing to print"
#   cargo tree -i quick-xml@0.39.4 --workspace --target all -> "nothing to print"
# No fixed polars release exists yet. Remove these entries once polars (and so
# object_store / zstd) moves to quick-xml >= 0.41 and zstd >= 0.14.3 / zstd-safe >= 8.2.0,
# and re-check whenever polars features change.
[advisories]
ignore = [
    "RUSTSEC-2026-0194", # quick-xml: quadratic duplicate-attribute check (not compiled)
    "RUSTSEC-2026-0195", # quick-xml: unbounded namespace allocation (not compiled)
    "RUSTSEC-2026-0391", # zstd: stream data leak on reused context (not compiled)
    "RUSTSEC-2026-0398", # zstd-safe: Seekable::decompress length (not compiled)
    "RUSTSEC-2026-0403", # zstd-safe: uninitialised memory on legacy frame (not compiled)
]
