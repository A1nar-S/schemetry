[package]
name = "schemetry"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "schemetry"
path = "src/main.rs"

[lib]
name = "schemetry_lib"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1.0", default-features = false }
base64 = "0.23"
encoding_rs = "0.8"
regex = { version = "1", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
oracle = { version = "0.6", default-features = false }
polars = { version = "0.55", default-features = false, features = ["csv"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rust_xlsxwriter = { version = "0.99", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }
tokio = { version = "1.44", default-features = false, features = ["rt", "rt-multi-thread"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Environment",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
