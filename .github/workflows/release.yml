name: Release

# Push a version tag to cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
# The tag (minus the leading "v") becomes the app/installer version.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release + notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Notes are generated from merged PRs since the previous tag, grouped by .github/release.yml.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Schemetry $TAG" \
            --generate-notes

  build-windows:
    name: Build Windows installers
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The repo holds a 0.0.0 placeholder; tauri.conf.json has no version, so Tauri reads Cargo.toml.
          for manifest in src-tauri/Cargo.toml core/Cargo.toml mcp/Cargo.toml; do
            sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" "$manifest"
            grep -q "^version = \"$VERSION\"" "$manifest"
          done

      # The MCP server ships next to the app as a Tauri sidecar (installed as schemetry-mcp.exe).
      - name: Build MCP server sidecar
        shell: bash
        run: |
          cargo build --release -p schemetry-mcp
          mkdir -p src-tauri/binaries
          cp target/release/schemetry-mcp.exe src-tauri/binaries/schemetry-mcp-x86_64-pc-windows-msvc.exe

      - name: Build (MSI + NSIS)
        run: npm run tauri build -- --bundles msi,nsis --config src-tauri/tauri.release.conf.json

      - name: Collect artifacts
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p out
          cp target/release/bundle/msi/*.msi out/
          cp target/release/bundle/nsis/*-setup.exe out/
          # Portable build: the bare app executable (needs the WebView2 runtime, preinstalled on Windows 10/11).
          cp target/release/schemetry.exe "out/Schemetry_${V}_x64_portable.exe"
          # Standalone MCP server for use without installing the app.
          cp target/release/schemetry-mcp.exe "out/schemetry-mcp_${V}_windows-x64.exe"
          cd out && sha256sum * > SHA256SUMS.txt && ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemetry-windows-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

  build-mcp-linux:
    name: Build MCP server (Linux)
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          for manifest in core/Cargo.toml mcp/Cargo.toml; do
            sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" "$manifest"
            grep -q "^version = \"$VERSION\"" "$manifest"
          done

      # No WebKit/GTK needed: the MCP server does not link the desktop shell.
      - run: cargo build --release -p schemetry-mcp

      - name: Collect artifacts
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p out
          cp target/release/schemetry-mcp "out/schemetry-mcp_${V}_linux-x64"
          chmod +x "out/schemetry-mcp_${V}_linux-x64"
          cd out && sha256sum * > SHA256SUMS-mcp-linux.txt && ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemetry-mcp-linux-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber
  publish:
    name: Publish release
    needs: [build-windows, build-mcp-linux]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
