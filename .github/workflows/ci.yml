name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (eslint + svelte-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tauri crate/npm versions match
        run: npm run check:tauri-versions
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (TypeScript + Svelte)
        run: npm run check -- --fail-on-warnings
      - name: Build
        run: npm run build

  rust-lint:
    name: Rust (fmt + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      # tauri::generate_context! embeds `../dist` at compile time.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked

  rust-test:
    name: Rust unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: cargo test --workspace --locked

  mcp-headless-linux:
    name: MCP server (Ubuntu, headless build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
          key: headless
      # Deliberately no WebKit/GTK packages and no frontend build: these crates must not need them.
      - run: cargo test --locked -p schemetry-core -p schemetry-mcp
      - run: cargo build --locked -p schemetry-mcp
      - name: Handshake smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | SCHEMETRY_DB="$RUNNER_TEMP/mcp.db" ./target/debug/schemetry-mcp \
            | grep -q '"name":"schemetry"'
  postgres-integration:
    name: Integration tests (Postgres) + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
          key: coverage
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Start and migrate Postgres containers
        working-directory: docker
        run: |
          docker compose up -d --wait postgres-source postgres-target
          docker compose run --rm flyway-pg-source
          docker compose run --rm flyway-pg-target
      - name: Run unit tests + Postgres integration suite (with coverage)
        run: |
          cargo llvm-cov --locked --no-report -p schemetry-core --lib
          cargo llvm-cov --locked --no-report -p schemetry-core --test postgres_integration -- --ignored
          cargo llvm-cov --locked --no-report -p schemetry-core --test mcp_integration -- --ignored
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: unit,postgres
          use_oidc: true
          fail_ci_if_error: false
      - name: Container logs on failure
        if: failure()
        working-directory: docker
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v

  oracle-integration:
    name: Integration tests (Oracle) + coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    env:
      ORACLE_CLIENT_LIB_DIR: ${{ github.workspace }}/instantclient
      LD_LIBRARY_PATH: ${{ github.workspace }}/instantclient
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libaio
        run: |
          sudo apt-get update
          sudo apt-get install -y libaio1t64
          # Instant Client links against libaio.so.1; Ubuntu 24.04 ships it as libaio.so.1t64.
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
      - name: Install Oracle Instant Client (Basic Light)
        run: |
          curl -fsSL -o ic.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          unzip -q ic.zip
          mv instantclient_* "$ORACLE_CLIENT_LIB_DIR"
          rm ic.zip
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
          key: coverage
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Start and migrate Oracle containers
        working-directory: docker
        run: |
          docker compose build flyway-source flyway-target
          docker compose up -d --wait --wait-timeout 600 oracle-source oracle-target
          docker compose run --rm flyway-source
          docker compose run --rm flyway-target
      - name: Run Oracle integration suite (with coverage)
        run: cargo llvm-cov --locked --lcov --output-path lcov.info -p schemetry-core --test oracle_integration -- --ignored
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: oracle
          use_oidc: true
          fail_ci_if_error: false
      - name: Container logs on failure
        if: failure()
        working-directory: docker
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v
