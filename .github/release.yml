# Categories for GitHub's auto-generated release notes (used by `gh release create --generate-notes`).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [feature, enhancement]
    - title: Bug fixes
      labels: [bug, fix]
    - title: Security
      labels: [security]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
