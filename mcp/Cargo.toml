[package]
name = "schemetry-mcp"
version = "0.0.0"
edition = "2024"

[lib]
name = "schemetry_mcp"
path = "src/lib.rs"

[[bin]]
name = "schemetry-mcp"
path = "src/main.rs"

[dependencies]
schemetry-core = { path = "../core" }
anyhow = { version = "1.0", default-features = false }
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
serde_json = "1"
tokio = { version = "1.44", default-features = false, features = ["rt", "rt-multi-thread"] }
