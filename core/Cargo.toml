[package]
name = "schemetry-core"
version = "0.0.0"
edition = "2024"

[lib]
name = "schemetry_core"
path = "src/lib.rs"

[dependencies]
anyhow = { version = "1.0", default-features = false }
base64 = "0.23"
dirs = "6"
encoding_rs = "0.8"
regex = { version = "1", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
oracle = { version = "0.6", default-features = false }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
polars = { version = "0.55", default-features = false, features = ["csv"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
rust_xlsxwriter = { version = "0.101", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }
tokio = { version = "1.44", default-features = false, features = ["rt", "rt-multi-thread", "net", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_EventLog"] }
