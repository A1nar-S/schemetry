# Coverage is uploaded by .github/workflows/ci.yml (unit + Postgres, and Oracle as separate flags;
# Codecov merges them). Statuses are informational so a coverage dip never blocks a PR.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: true

ignore:
  - "core/tests/**"
  - "core/src/**/tests/**"
  - "core/src/test_support.rs"
  - "mcp/src/tests/**"

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true
